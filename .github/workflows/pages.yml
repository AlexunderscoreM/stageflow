name: Publish web app and dancer portal

# Publishes to GitHub Pages:
#   https://<you>.github.io/stageflow/      → dancer portal + phone viewer (src/viewer)
#   https://<you>.github.io/stageflow/app/  → the StageFlow editor for the web (src)
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['src/**', 'cloud.config.json', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - run: bash scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub Pages sometimes answers with a temporary server error: try once more after a pause
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
